<!doctype html>
<html lang="uk">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Attendance Tracking System</title>
  <meta name="description"
    content="Облік відвідуваності занять: групи, предмети, розклад і позначки присутності студентів у реальному часі." />
  <meta name="theme-color" content="#2563eb" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Open Graph: попередній перегляд посилання в соцмережах і месенджерах (завдання 19).
       Після розгортання замінити your-app.vercel.app на реальну адресу застосунку -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Student Attendance Tracking System" />
  <meta property="og:description" content="Облік відвідуваності занять: групи, предмети, розклад і позначки присутності." />
  <meta property="og:image" content="https://web-dev-labs-lovat.vercel.app/pwa-512x512.png" />
  <meta property="og:url" content="https://web-dev-labs-lovat.vercel.app/" />
  <meta name="twitter:card" content="summary" />

  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var dark =
        saved === 'dark' ||
        (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
